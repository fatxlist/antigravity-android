[workspace]
members = ["."]
resolver = "2"

[package]
name = "agy"
version = "0.1.0"
edition = "2021"
description = "Multicall native Bionic CLI helper for Antigravity Android (fix-paths, notify)"

[dependencies]
crc32fast = "1"
libc = "0.2"
memchr = "2"
regex = { version = "1", default-features = false, features = ["std", "perf"] }
serde_json = "1"
ureq = { version = "2", default-features = false }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
