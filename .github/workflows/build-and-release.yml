name: Build and Release Antigravity APKs

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v2.5.1)'
        required: false
        default: ''
      draft:
        description: 'Create Draft Release'
        type: boolean
        default: false
      prerelease:
        description: 'Mark as Pre-release'
        type: boolean
        default: false
      vendor_url:
        description: 'Optional direct URL to download vendor inputs archive (core, glibc, certs, seed, shims)'
        required: false

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: Test and Build Antigravity APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Setup Java JDK (Java 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Python 3
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Rust Toolchain (aarch64-linux-android)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache Rust Dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/agy

      - name: Install Android Build Tools & System Utilities
        run: |
          sudo apt-get update
          sudo apt-get install -y aapt zipalign apksigner file zip unzip gzip

      - name: Prepare Vendor Inputs & Debug Keystore
        env:
          VENDOR_URL: ${{ inputs.vendor_url || secrets.VENDOR_DOWNLOAD_URL }}
        run: |
          mkdir -p tools
          
          # 1. Generate debug keystore if absent (used by --dev and CI --allow-debug-sign builds)
          if [ ! -f "tools/debug.keystore" ]; then
            echo "[CI] Generating debug keystore..."
            keytool -genkey -v -keystore tools/debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          # 2. Setup Android API 28 android.jar if absent
          if [ ! -f "tools/android.jar" ]; then
            echo "[CI] Fetching android.jar (API 28)..."
            curl -fsSL -o tools/android.jar "https://github.com/Sable/android-platforms/raw/master/android-28/android.jar" || \
            curl -fsSL -o tools/android.jar "https://raw.githubusercontent.com/iBotPeaches/platform_frameworks_base/master/android-28.jar"
          fi

          # 3. Setup R8 / D8 compiler jar if absent
          if [ ! -f "tools/r8.jar" ]; then
            echo "[CI] Fetching r8.jar..."
            curl -fsSL -o tools/r8.jar "https://dl.google.com/dl/android/maven2/com/android/tools/r8/8.2.42/r8-8.2.42.jar"
          fi

          # 4. Handle optional external vendor archive override
          if [ -n "$VENDOR_URL" ]; then
            echo "[CI] Downloading vendor inputs from $VENDOR_URL..."
            mkdir -p vendor
            curl -fsSL -o vendor.tar.gz "$VENDOR_URL"
            tar -xzf vendor.tar.gz -C vendor
            echo "AGY_HOME=$PWD/vendor" >> "$GITHUB_ENV"
          fi

      - name: Run Automated Test Suites
        run: |
          python3 modules/builder/check_versions.py
          bash modules/core/tests/run_all.sh
          bash modules/patches/tests/run_all.sh
          bash modules/io/tests/run_all.sh
          bash modules/env/tests/run_all.sh
          bash modules/builder/tests/run_all.sh
          cargo test --manifest-path native/agy/Cargo.toml
          REQUIRE_NATIVE=1 bash modules/builder/04b_build_native.sh
          python3 -B -m unittest discover -s env/tests -v
          bash env/build.sh assets
          bash env/tests/invariant
          bash web/build.sh
          bash web/tests/selftest.sh
          node web/tests/test_web_patches.mjs
          bash app/src/test/run_java_tests.sh

      - name: Build Standard Release APK (dist/antigravity.apk)
        env:
          AGY_RELEASE_KEYSTORE_B64: ${{ secrets.AGY_RELEASE_KEYSTORE_B64 }}
          AGY_RELEASE_KEY_ALIAS: ${{ secrets.AGY_RELEASE_KEY_ALIAS }}
          AGY_RELEASE_KEY_PASS: ${{ secrets.AGY_RELEASE_KEY_PASS }}
          AGY_RELEASE_STORE_PASS: ${{ secrets.AGY_RELEASE_STORE_PASS }}
        run: |
          if [ -n "$AGY_RELEASE_KEYSTORE_B64" ]; then
            echo "$AGY_RELEASE_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            export AGY_RELEASE_KEYSTORE="$RUNNER_TEMP/release.keystore"
            bash build.sh --require-native
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "[ERROR] Tagged release builds require AGY_RELEASE_KEYSTORE_B64, AGY_RELEASE_KEY_ALIAS, AGY_RELEASE_KEY_PASS, and AGY_RELEASE_STORE_PASS secrets." >&2
            exit 1
          else
            echo "[CI] No AGY_RELEASE_* secrets configured; building verification APK with --allow-debug-sign."
            bash build.sh --allow-debug-sign --require-native
          fi

      - name: Compute Cryptographic Checksums
        run: |
          cd dist
          sha256sum antigravity.apk > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: antigravity-apk-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            dist/antigravity.apk
            dist/SHA256SUMS.txt

      - name: Publish GitHub Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          name: ${{ format('Antigravity for Android {0}', github.event.inputs.tag_name || github.ref_name) }}
          draft: ${{ github.event.inputs.draft || false }}
          prerelease: ${{ github.event.inputs.prerelease || false }}
          make_latest: true
          files: |
            dist/antigravity.apk
            dist/SHA256SUMS.txt
          body_path: RELEASE_NOTES.md
