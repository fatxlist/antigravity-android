name: Sync Core Binary

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Upstream Antigravity version (e.g. 2.35.2)'
        required: true
        default: '2.35.2'
      build_id:
        description: 'Upstream build ID (e.g. 4585983447007232)'
        required: true
        default: '4585983447007232'
      update_version_refs:
        description: 'Update CORE_VERSION in config/app.env and README badges'
        type: boolean
        required: false
        default: true
      open_pr:
        description: 'Open a Pull Request instead of pushing directly to the branch'
        type: boolean
        required: false
        default: true

permissions:
  contents: write
  pull-requests: write

jobs:
  sync-core:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Python 3
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Download & pack language_server
        env:
          VER: ${{ inputs.version }}
          BUILD: ${{ inputs.build_id }}
          UPDATE_REFS: ${{ inputs.update_version_refs }}
        run: |
          set -euo pipefail
          if ! [[ "$VER" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid version format: $VER" >&2
            exit 1
          fi
          if ! [[ "$BUILD" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "Invalid build_id format: $BUILD" >&2
            exit 1
          fi

          URL="https://storage.googleapis.com/antigravity-public/antigravity-hub/${VER}-${BUILD}/linux-arm/Antigravity.tar.gz"
          curl -fSL "$URL" -o "$RUNNER_TEMP/Antigravity.tar.gz"
          mkdir -p "$RUNNER_TEMP/extracted"
          tar -xzf "$RUNNER_TEMP/Antigravity.tar.gz" -C "$RUNNER_TEMP/extracted" Antigravity-arm64/resources/bin/language_server
          BIN="$RUNNER_TEMP/extracted/Antigravity-arm64/resources/bin/language_server"
          tar -czf modules/core/pristine/language_server.tar.gz -C "$(dirname "$BIN")" language_server

          ARCHIVE_SHA=$(sha256sum modules/core/pristine/language_server.tar.gz | awk '{print $1}')
          BIN_SHA=$(sha256sum "$BIN" | awk '{print $1}')
          BIN_SIZE=$(stat -c %s "$BIN")

          cat > modules/core/spec/version.env <<EOF
          # Core Version & Environment Spec
          CORE_VERSION=${VER}
          CORE_BUILD_TAG=${BUILD}
          TARGET_ARCH=aarch64
          LOADER_NAME=ld-linux-aarch64.so.1
          CORE_BIN_NAME=language_server
          EOF

          cat > modules/core/spec/checksums.json <<EOF
          {
            "archive": {
              "filename": "language_server.tar.gz",
              "sha256": "${ARCHIVE_SHA}"
            },
            "binary": {
              "filename": "language_server",
              "sha256": "${BIN_SHA}",
              "size": ${BIN_SIZE}
            }
          }
          EOF

          if [ "$UPDATE_REFS" = "true" ]; then
            python3 - "$VER" <<'PYEOF'
          import pathlib, re, sys
          ver = sys.argv[1]
          env_p = pathlib.Path("config/app.env")
          env_txt = env_p.read_text(encoding="utf-8")
          env_txt = re.sub(r"^CORE_VERSION=.*$", f"CORE_VERSION={ver}", env_txt, flags=re.M)
          env_p.write_text(env_txt, encoding="utf-8")

          for name, prefix in (("README.md", "badge/Core-v"), ("README.ru.md", "badge/Ядро-v")):
              p = pathlib.Path(name)
              if p.is_file():
                  txt = p.read_text(encoding="utf-8")
                  txt = re.sub(rf"{re.escape(prefix)}[0-9]+\.[0-9]+\.[0-9]+-", f"{prefix}{ver}-", txt)
                  p.write_text(txt, encoding="utf-8")
          PYEOF
          fi

      - name: Verify core & patch pipeline
        run: |
          python3 modules/builder/check_versions.py
          bash modules/core/tests/run_all.sh
          bash modules/patches/tests/run_all.sh

      - name: Commit and open PR or push
        env:
          VER: ${{ inputs.version }}
          BUILD: ${{ inputs.build_id }}
          OPEN_PR: ${{ inputs.open_pr }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add modules/core/pristine/language_server.tar.gz modules/core/spec/version.env modules/core/spec/checksums.json config/app.env README.md README.ru.md
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          MSG="feat(core): sync language_server ${VER}-${BUILD}"
          if [ "$OPEN_PR" = "true" ]; then
            BRANCH="chore/sync-core-${VER}"
            git checkout -B "$BRANCH"
            git commit -m "$MSG"
            git push --force-with-lease origin "$BRANCH"
            gh pr create --base "${{ github.ref_name }}" --head "$BRANCH" --title "$MSG" --body "Automated core binary sync for Antigravity \`${VER}-${BUILD}\`." || \
              gh pr edit "$BRANCH" --title "$MSG" --body "Automated core binary sync for Antigravity \`${VER}-${BUILD}\`."
          else
            git commit -m "$MSG"
            git push
          fi
